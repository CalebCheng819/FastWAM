# @package _global_

# Formal 4-node x 8-GPU DLC scale profile.  The 8-GPU ablation baseline keeps
# gradient_accumulation_steps=4; at 32 GPUs this override preserves the same
# 32-rank optimizer-update scale with one micro-batch per rank.
gradient_accumulation_steps: 1

# Every formal 2 x 2 x 2 ablation arm publishes a self-contained full MoT
# checkpoint.  In particular, VG0/action-only arms must not serialize a
# node-local /tmp official-checkpoint dependency into their final weights.
checkpoint_state_kind: full
seal_training_state: true

# Rank zero may need to serialize, copy, strongly read back, and hash a full
# multi-billion-parameter checkpoint on a shared object/filesystem mount.
# Other ranks poll COMPLETE/manifest files outside collectives, while this
# explicit process-group watchdog protects the remaining short barriers and
# DeepSpeed collectives from the framework's much smaller implicit default.
process_group_timeout_seconds: 21600
checkpoint_io_timeout_seconds: 21600

# A deterministic, cardinality-stratified held-out loss check.  This is not a
# simulator rollout or task-success metric.
eval_every: 1000
offline_eval_num_samples: 12
