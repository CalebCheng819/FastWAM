# @package _global_

defaults:
  - _self_
  - data: null
  - model: null
  - task: null


output_dir: ./runs/train/${now:%Y-%m-%d}_${now:%H-%M-%S}

# dataloading
batch_size: 2
num_workers: 4

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1.0e-4
num_epochs: 1
max_steps: null
log_every: 10
save_every: 100
eval_every: 50
eval_num_inference_steps: 10
# Multi-robot configs use a deterministic held-out loss subset instead of the
# single-robot video rollout evaluator. Zero keeps that evaluator disabled
# unless an explicit scale/task profile opts in.
offline_eval_num_samples: 0

# training
gradient_accumulation_steps: 1
# Optional deterministic B4 schedule treatment.  Zero preserves the original
# task/count-balanced sampler; the committed B4 task selects the audited 50/50
# original/target-action-phase mixture without increasing epoch token exposure.
phase_balanced_fraction: 0.0
mixed_precision: "bf16" # one of: [no, fp16, bf16]
seed: 42
max_grad_norm: 1.0
weight_decay: 0.0
resume: null
# Explicit cross-treatment initialization contract.  Ordinary checkpoints keep
# strict treatment matching; a task must opt in and declare the exact native-v2
# source metadata before the trainer may initialize from different treatment
# weights with a fresh optimizer/scheduler/step state.
weights_only_warm_start:
  enabled: false
  expected_source_training_mode: null
  expected_source_trainable_scope: null
  expected_source_state_kind: full
# Full-state directories without the v1 scientific run contract are refused
# before Accelerator mutates model/optimizer state.  Set true only for an
# explicitly audited legacy recovery; formal runs keep this false.
allow_legacy_resume: false
# Research-artifact provenance policy.  ``sha256`` preserves the historical
# contracts.  ``stat_cmp`` records paths, sizes, mtimes, and counts directly
# and uses bytewise readback for copied artifacts; it is reserved for runs such
# as B4 that intentionally avoid creating a new provenance hash chain.
provenance_mode: sha256
trainable_scope: dit
# `auto` preserves the historical behavior: full weights for a fully trainable
# DiT and a base-dependent sparse delta for a staged action/hub-only treatment.
# Formal 32-GPU runs override this to `full`, making every reported weights
# artifact self-contained even for action-only ablations.
checkpoint_state_kind: auto
save_training_state: true
# When enabled, rank zero hashes the complete post-barrier Accelerate/DeepSpeed
# state directory into an immutable JSON manifest (path, bytes, SHA-256).
seal_training_state: false
save_final_checkpoint: true
# Formal 32-GPU training publishes a self-contained run-level terminal seal
# only after the final checkpoint has been strongly read back. Diagnostic and
# gate phases opt in explicitly so an ordinary local run cannot claim formal
# completion.
seal_training_run: false
# This flag is owned by the committed N=4 gate scale. It is never a user-side
# Hydra override surface in the formal launcher.
formal_n4_fullmodel_gate: false
# Rehash full weight files while building a formal terminal seal. State shards
# are already hashed by the adjacent state-tree manifest and are fully re-read
# by the fresh-process gate/resume validator.
terminal_rehash_weights: true
# Operational watchdogs.  Formal multi-node runs override both with a window
# sized for large checkpoint publication; they are intentionally excluded from
# the scientific full-state resume contract.
process_group_timeout_seconds: 1800
checkpoint_io_timeout_seconds: 1800

# wandb
wandb:
  enabled: false
  workspace: null
  project: fast-wam
  name: train
  group: null
  mode: online

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
