# @package _global_

# P9 keeps the P6 spatial cross-attention architecture and adds only the P8
# gripper-event and stable-close proxy objectives. This isolates gripper timing
# supervision from P7's task-conditioned relation layer.
defaults:
  - robofactory_placefood_spatial_semantic_p6_224_5e-6
  - _self_

weights_only_warm_start:
  architecture_upgrade: null

model:
  action_dit_config:
    gaussian_conditioning_mode: spatial_cross_attention
    gaussian_residual_floor: 0.1
    gaussian_attention_temperature: 0.1
  loss:
    b4:
      enabled: true
      lambda_arm_huber: 0.0
      lambda_gripper_event: 2.0
      lambda_contact_intent_proxy: 1.0
      arm_huber_beta: 0.1
      first_steps: 5
      first_steps_weight: 2.0
      gripper_dim: 7
      gripper_action_mean: 0.24164481092854787
      gripper_action_std: 0.9469631616807775
      event_delta_threshold: 0.05
      stable_closed_command_threshold: -0.8
      closed_command_threshold: 0.0
      stable_steps: 4
      event_temperature: 0.05
      closed_temperature: 0.1
      background_weight: 0.25

# The stable-close target is derived from expert actions, not measured contact.
wandb:
  group: robofactory-placefood-spatial-gripcontact-p9
  name: fastwam-placefood-spatial-gripcontact-p9-s42-24g-r1
