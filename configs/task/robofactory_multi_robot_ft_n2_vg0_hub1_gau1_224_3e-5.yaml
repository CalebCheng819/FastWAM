# @package _global_

# Shared one-node/8-GPU N=2 action-policy fine-tuning profile. The completed
# joint VG1+Hub1+Gau1 step-5000 model is a strict full-weight initialization,
# not a resume: optimizer, scheduler, sampler cursor, and global step restart.
defaults:
  - robofactory_multi_robot_vg0_hub1_gau1_224_1e-4
  - _self_

learning_rate: 3.0e-5
max_steps: 1000
log_every: 10
save_every: 500
eval_every: 500
offline_eval_num_samples: 32
gradient_accumulation_steps: 4

resume: null
init_weights: /oss-chengjuntao/artifacts/fastwam-n234-vg1hub1gau1-s42-5000-r2a2-beg0t5rle97qepyw8u-a57915104bff-20260802t1820z/checkpoints/weights/step_005000.pt
checkpoint_state_kind: full
save_training_state: true
save_final_checkpoint: true

data:
  train:
    required_agent_counts: [2]
  val:
    required_agent_counts: [2]

wandb:
  group: robofactory-multirobot-n2-task-scope-finetune
