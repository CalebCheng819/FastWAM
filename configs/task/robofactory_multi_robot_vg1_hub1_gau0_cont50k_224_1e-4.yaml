# @package _global_

defaults:
  - robofactory_multi_robot_vg1_hub1_gau0_224_1e-4
  - _self_

# Continue the audited GAU0 step-5000 weights with a fresh optimizer.  The
# global step remains cumulative so checkpoints are named 10k ... 50k.
trainable_scope: dit
batch_size: 1
learning_rate: 1.0e-4
weight_decay: 1.0e-2
lr_scheduler_type: cosine
max_steps: 50000
run_initial_global_step: 5000
save_every: 5000
eval_every: 5000
offline_eval_num_samples: 12
phase_balanced_fraction: 0.0
checkpoint_state_kind: full
provenance_mode: stat_cmp
resume: ${oc.env:FASTWAM_B4_BASE_CHECKPOINT}

weights_only_warm_start:
  enabled: true
  expected_source_training_mode: joint
  expected_source_trainable_scope: dit
  expected_source_state_kind: full
  # The audited historical step-5000 checkpoint predates state_kind and the
  # current full architecture envelope.  Its seven-field legacy architecture
  # dict and exact provenance pointer are pinned in the loader while its full
  # `mot` payload remains subject to exact key/shape validation.  Newly written
  # checkpoints remain native-v2 full.
  allow_legacy_full_source_metadata: true
  expected_legacy_source_base_checkpoint: /cpfs/user/chengjuntao/checkpoints/FastWAM/yuanty-fastwam-139eebb6d90cdd9bdbbe465f72c6edc9ad5a518a/libero_uncond_2cam224.pt

data:
  train:
    load_future_video: true
    gaussian_cache_dir: null
    gaussian_cache_verify: null
    gaussian_cache_expected_manifest_sha256: null
    gaussian_cache_expected_selection_sha256: null
    gaussian_cache_expected_source_identity_sha256: null
  val:
    load_future_video: true
    gaussian_cache_dir: null
    gaussian_cache_verify: null
    gaussian_cache_expected_manifest_sha256: null
    gaussian_cache_expected_selection_sha256: null
    gaussian_cache_expected_source_identity_sha256: null

model:
  training_mode: joint
  action_dit_config:
    hub_enabled: true
    enable_gaussian: false
  loss:
    lambda_video: 1.0
    lambda_action: 1.0
    b4:
      enabled: false

wandb:
  group: robofactory-multirobot-vg1-hub1-gau0-cont50k
  name: fastwam-n234-vg1h1gau0-cont50k-s42-24g-r3
