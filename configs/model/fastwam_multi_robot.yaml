_target_: fastwam.runtime.create_multi_robot_fastwam
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
redirect_common_files: true
mot_checkpoint_mixed_attn: true
training_mode: action_only_cache
# Native multi-agent Action -> World conditioning.  ACV0 leaves this at
# ``none``.  ACV1 overrides it with ``hub_kv_lagged`` so future-video queries
# read dynamic fused global hubs from the preceding transformer layer.  Those
# hubs aggregate noisy action/state/identity, observed video and text;
# observed-frame queries and the action branch remain isolated.
video_conditioning:
  mode: none
  start_layer: 1
  detach_hub_kv: true
# The official FastWAM checkpoint supplied by the task config restores every
# shape-compatible video/action backbone tensor.  New 8D I/O, state, and hub
# tensors remain randomly initialized by design.
action_dit_pretrained_path: null
skip_dit_load_from_pretrain: true

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  video_attention_mask_mode: first_frame_causal
  action_conditioned: false
  action_dim: ${data.train.action_dim}
  action_group_causal_mask_mode: group_diagonal

action_dit_config:
  action_dim: ${data.train.action_dim}
  state_dim: ${data.train.state_dim}
  # Geometry is the primary permutation-equivariant identity signal. Hub
  # queries are generated dynamically with K(N)=ceil(hub_token_ratio * N), so
  # neither agents nor hubs use a fixed-capacity parameter bank.
  agent_encoding_mode: geometry
  agent_geometry_dim: ${data.train.agent_geometry_dim}
  hub_enabled: true
  hub_token_ratio: 2.0
  agent_rope_dim: 48
  agent_phase_scale: 1.0
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_video: 0.0
  lambda_action: 1.0
